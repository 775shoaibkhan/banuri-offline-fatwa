<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#104b3c"><link rel="manifest" href="manifest.webmanifest"><title>اردو آف لائن فتاویٰ لائبریری</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#20312c;font:17px/1.9 Tahoma,Arial,sans-serif}header{background:#104b3c;color:#fff;padding:24px 16px}header h1{font-size:23px;margin:0}header p{margin:2px 0;font-size:13px}main{max-width:860px;margin:auto;padding:16px}.panel,.result{background:#fff;border:1px solid #dfe9e3;border-radius:14px;margin:12px 0;padding:15px}input{width:100%;padding:13px;border:1px solid #b8d4c7;border-radius:10px;font-size:18px}button{border:0;border-radius:9px;color:white;background:#166d54;padding:11px 15px;font-size:15px;cursor:pointer;margin:3px}button:disabled{opacity:.5}button.secondary{background:#34546d}.muted{color:#61736c;font-size:13px}.result h3{margin:0;font-size:18px}.result a{color:#126448}#detail{display:none;white-space:pre-wrap;overflow-wrap:anywhere}#detail h2{margin:0}progress{width:100%;height:15px;accent-color:#167859}#results{min-height:50px}.tag{font-size:12px;color:#45685b}article p{white-space:pre-wrap}#state{font-size:14px}#back{display:none}a{overflow-wrap:anywhere}
</style></head><body><header><h1>📖 اردو آف لائن فتاویٰ لائبریری</h1><p>ذاتی مطالعے کے لیے — اصل ماخذ: جامعہ بنوری ٹاؤن</p></header><main><section class="panel"><b id="count">ریکارڈ چیک ہو رہے ہیں...</b><p class="muted">پہلی بار انٹرنیٹ کے ساتھ تمام فتاویٰ محفوظ کریں؛ اس کے بعد بغیر انٹرنیٹ تلاش کریں۔ تقریباً 69 ہزار ریکارڈ کا ڈیٹا فون میں جگہ لے گا۔</p><button id="download">تمام فتاویٰ فون میں محفوظ کریں</button><button id="verify" class="secondary">آف لائن ریکارڈ چیک</button><progress id="progress" value="0" max="100"></progress><div id="state" aria-live="polite">تیار</div></section><section id="searchArea" class="panel"><input id="q" placeholder="مثلاً: قضائے حاجت، نماز، طلاق"><div><button id="go">تلاش کریں</button><button id="cancel" class="secondary" disabled>روکیں</button></div><div id="searchStatus" class="muted">صرف محفوظ کردہ ریکارڈ میں تلاش ہوگی</div></section><button id="back" class="secondary">واپس نتائج پر</button><section id="results"></section><article id="detail" class="panel"></article></main><script>
const $=id=>document.getElementById(id);let manifest,stop=false,locked=false;
const DBNAME='fatwa-offline-v1';let db;
function normalize(s){return String(s||'').toLowerCase().replace(/[أإآٱ]/g,'ا').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[ۀة]/g,'ہ').replace(/[\u064b-\u065f\u0670]/g,'').replace(/\s+/g,' ').trim()}
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('parts'))d.createObjectStore('parts')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function getPart(i){return new Promise((resolve,reject)=>{let r=db.transaction('parts','readonly').objectStore('parts').get(i);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function setPart(i,blob){return new Promise((resolve,reject)=>{let t=db.transaction('parts','readwrite');t.objectStore('parts').put(blob,i);t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
function partCount(){return new Promise((resolve,reject)=>{let r=db.transaction('parts','readonly').objectStore('parts').count();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function decode(buffer){const stream=new Blob([buffer]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(stream).text())}
async function fetchManifest(){let r=await fetch('manifest-data.json');if(!r.ok)throw Error('Manifest download error');return r.json()}
async function download(){if(locked)return;locked=true;stop=false;$('download').disabled=true;try{if(!navigator.onLine)throw Error('انٹرنیٹ دستیاب نہیں');for(let i=0;i<manifest.parts.length;i++){if(stop)break;if(await getPart(i)){continue}let path=manifest.parts[i].file;let response=await fetch(path,{cache:'no-store'});if(!response.ok)throw Error('File '+path+' HTTP '+response.status);let buffer=await response.arrayBuffer();let rows=await decode(buffer);if(rows.length!==manifest.parts[i].count)throw Error('Data count mismatch: '+path);await setPart(i,buffer);let n=await partCount();$('progress').value=100*n/manifest.parts.length;$('state').textContent=n+'/'+manifest.parts.length+' حصے محفوظ — '+(n===manifest.parts.length?'آف لائن تیار':'ڈاؤن لوڈ جاری');}if(!stop&&await partCount()===manifest.parts.length)$('state').textContent='✅ تمام فتاویٰ فون میں محفوظ ہیں؛ انٹرنیٹ بند کرکے بھی تلاش کر سکتے ہیں';}catch(e){$('state').textContent='ڈاؤن لوڈ رکا: '+e.message+' — دوبارہ دبانے سے وہیں سے جاری ہوگا'}finally{locked=false;$('download').disabled=false}}
async function verify(){let n=await partCount();$('state').textContent=n+'/'+manifest.parts.length+' حصے فون میں محفوظ';$('progress').value=100*n/manifest.parts.length}
function makeResult(r,pi,ri){let div=document.createElement('div');div.className='result';let a=document.createElement('a');a.href='#fatwa';a.textContent=r[0]||'بغیر عنوان';a.addEventListener('click',e=>{e.preventDefault();showFatwa(pi,ri)});let meta=document.createElement('div');meta.className='tag';meta.textContent='فتویٰ نمبر: '+r[3];let brief=document.createElement('div');brief.className='muted';brief.textContent=(r[1]||'').slice(0,180);div.append(a,meta,brief);$('results').append(div)}
async function showFatwa(pi,ri){const data=await getPart(pi);if(!data){alert('یہ حصہ فون میں محفوظ نہیں');return}let r=(await decode(data))[ri];$('detail').replaceChildren();let title=document.createElement('h2');title.textContent=r[0];let meta=document.createElement('div');meta.className='muted';meta.textContent='فتویٰ نمبر: '+r[3]+' | تاریخ: '+r[4];let q=document.createElement('h3');q.textContent='سوال';let qp=document.createElement('p');qp.textContent=r[1];let a=document.createElement('h3');a.textContent='جواب';let ap=document.createElement('p');ap.textContent=r[2];$('detail').append(title,meta,q,qp,a,ap);if(/^https?:\/\//.test(r[5])){let link=document.createElement('a');link.href=r[5];link.target='_blank';link.rel='noopener';link.textContent='اصل فتویٰ کھولیں (انٹرنیٹ)';$('detail').append(link)}$('searchArea').style.display='none';$('results').style.display='none';$('detail').style.display='block';$('back').style.display='inline-block';window.scrollTo(0,0)}
function back(){$('searchArea').style.display='block';$('results').style.display='block';$('detail').style.display='none';$('back').style.display='none'}
async function search(){if(locked)return;let words=normalize($('q').value).split(' ').filter(Boolean);if(!words.length)return;locked=true;stop=false;$('go').disabled=true;$('cancel').disabled=false;back();$('results').replaceChildren();let found=0,checked=0;try{for(let i=0;i<manifest.parts.length;i++){if(stop)break;let buf=await getPart(i);if(!buf)continue;let rows=await decode(buf);for(let k=0;k<rows.length;k++){let r=rows[k],str=normalize([r[0],r[1],r[2],r[3]].join(' '));if(words.every(w=>str.includes(w))){found++;if(found<=100)makeResult(r,i,k)}}checked+=rows.length;$('searchStatus').textContent=checked+' ریکارڈ چیک — '+found+' نتائج'+(found>100?' (پہلے 100 دکھائے گئے)':'');await new Promise(resolve=>setTimeout(resolve,0))}if(!found)$('searchStatus').textContent='کوئی نتیجہ نہیں ملا — چھوٹے الفاظ آزمائیں';}catch(e){$('searchStatus').textContent='تلاش میں مسئلہ: '+e.message}finally{locked=false;$('go').disabled=false;$('cancel').disabled=true}}
$('download').onclick=download;$('verify').onclick=verify;$('go').onclick=search;$('cancel').onclick=()=>stop=true;$('back').onclick=back;$('q').onkeydown=e=>{if(e.key==='Enter')search()};
(async()=>{try{db=await openDB();manifest=await fetchManifest();$('count').textContent=manifest.count.toLocaleString()+' فتاویٰ کے ریکارڈ';await verify();if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}}catch(e){$('state').textContent='ابتدائی مسئلہ: '+e.message}})();
</script></body></html>
